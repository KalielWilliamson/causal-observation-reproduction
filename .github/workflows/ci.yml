name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this variable to be set to any value.
  # Set it to 3 to support 8-bit color graphics (256 colors per channel)
  # for libraries that care about the value set.
  FORCE_COLOR: 3

jobs:
  lint:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: j178/prek-action@v2

      - name: Run Pylint
        run: uvx nox -s pylint -- --output-format=github

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        # `ribs -> numba -> llvmlite` publishes supported wheels for the
        # current macOS runner, but not the retired Intel image. Keep the
        # cross-platform gate on Linux, Windows, and current macOS.
        runs-on: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install package
        run: uv sync --group test

      - name: Test package
        run: >-
          uv run pytest -ra --cov --cov-report=xml --cov-report=term
          --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  contracts:
    name: Validate public CUE contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate canonical CUE protocols
        run: bash scripts/reproduce.sh contract-check

  learned-reference:
    name: Check exact one-step learned experiment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install learned dependencies
        run: uv sync --extra learned

      - name: Check source-derived learned-gate behavior
        run: >-
          uv run pytest tests/test_reference_one_step.py
          tests/reference_source/test_learned_coo_gate.py

  release-quality:
    name: Documentation and formal artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build public documentation
        run: uv run --script noxfile.py -s docs --non-interactive

      - name: Check Lean formal artifacts
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: CausalObservationReproduction
          lint: false
          test: false

  container-smoke:
    name: Containerized public reproduction
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the public benchmark image
        run: docker build --tag causal-observation-reproduction:ci .

      - name: Run the exact sequential smoke path in the image
        run: >-
          docker run --rm -v "$PWD/artifacts/runs:/outputs"
          causal-observation-reproduction:ci smoke
          --output-dir=/outputs/container-smoke

  pass:
    if: always()
    needs:
      [
        lint,
        checks,
        contracts,
        learned-reference,
        release-quality,
        container-smoke,
      ]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
