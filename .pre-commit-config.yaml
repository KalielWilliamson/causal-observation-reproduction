ci:
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: "monthly"

exclude: ^.cruft.json|.copier-answers.yml$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.6"
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.4"
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown, pyproject]

  # Run against the project environment: the isolated mirror environment does
  # not install this package's runtime dependencies or their type metadata.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run --all-extras --with mypy mypy
        files: src|tests|tools|noxfile.py
        pass_filenames: false

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.3"
    hooks:
      - id: codespell
        args: [--ignore-words-list=coo]
        additional_dependencies:
          - tomli; python_version<'3.11'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "v0.11.0.1-1"
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: .pre-commit-config.yaml

  - repo: local
    hooks:
      - id: validate-pyproject
        name: Validate pyproject.toml
        language: system
        entry: >-
          uv run --no-project --with validate-pyproject==0.26 --with
          validate-pyproject-schema-store[all] validate-pyproject pyproject.toml
        pass_filenames: false

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.0"
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "v1.29.0"
    hooks:
      - id: zizmor
