[build-system]
requires = ["uv_build>=0.7.19,<0.12"]
build-backend = "uv_build"


[project]
name = "causal-observation-reproduction"
version = "0.1.0"
authors = [
  { name = "Kaliel Williamson", email = "kwilliamson35@gatech.edu" },
]
description = "Reproducible benchmark and formal artifacts for sequential causal observation research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "sympy>=1.13,<2",
]

[project.optional-dependencies]
learned = [
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "pyarrow>=18,<23",
  "torch>=2.4,<3",
]
rl = [
  "gymnasium>=1.1,<2",
  "stable-baselines3>=2.6,<3",
]
minigrid = [
  "gymnasium>=1.1,<2",
  "minigrid>=3,<4",
  "stable-baselines3>=2.6,<3",
]

[project.scripts]
causal-observation-run = "causal_observation_reproduction.runner:main"

[project.urls]
Homepage = "https://github.com/KalielWilliamson/causal-observation-reproduction"
"Bug Tracker" = "https://github.com/KalielWilliamson/causal-observation-reproduction/issues"
Discussions = "https://github.com/KalielWilliamson/causal-observation-reproduction/discussions"
Changelog = "https://github.com/KalielWilliamson/causal-observation-reproduction/releases"


[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
]
dev = [
  { include-group = "test" },
]
docs = [
    "markdown>=3.9",
    "mdx-include>=1.4.2",
    "mkdocs-material>=9.1.19",
    "mkdocstrings-python>=1.18.2",
    "properdocs>=1.6.7",
    "pyyaml>=6.0.1",
]


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
filterwarnings = [
  "error::DeprecationWarning:causal_observation_reproduction",
  "error::PendingDeprecationWarning:causal_observation_reproduction",
]
log_level = "INFO"
testpaths = [
  "tests",
]


[tool.coverage]
run.source = ["causal_observation_reproduction"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests", "tools"]
python_version = "3.13"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "causal_observation_reproduction.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
  "networkx",
  "pandas",
  "sympy",
  "sympy.*",
]
ignore_missing_imports = true


[tool.ruff]
show-fixes = true

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "NPY",    # NumPy specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["causal_observation_reproduction._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["EXE001", "T20"]
"docs/examples/**" = ["T20"]
"src/causal_observation_reproduction/extensions/**" = [
  "PLC0415", # optional scientific dependencies load only for selected extensions
]
"src/causal_observation_reproduction/reference/**" = [
  "ARG001",  # preserve source-derived callback signatures
  "EM101",   # preserve source-derived exception text at parity boundaries
  "EM102",
  "FURB171",
  "NPY002",  # the copied protocol fixes and records every random seed
  "PERF401",
  "PLC0415", # optional scientific dependencies are imported at point of use
  "RET503",
  "RET504",
  "RUF046",
  "RUF059",
  "T201",    # source-derived module CLIs remain directly executable
  "TC001",
  "TC003",
  "TRY003",
  "TRY004",
]


[tool.pylint]
py-version = "3.11"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "attribute-defined-outside-init",
  "abstract-method",
  "duplicate-code",
  "unused-import",
  "no-value-for-parameter",
  "wrong-import-position",
  # Optional backends and public extension dispatch are deliberately lazy.
  "import-outside-toplevel",
  # Source-derived scientific grids are kept structurally close to the pinned code.
  "too-many-lines",
  "too-many-nested-blocks",
  # The explicit two-variable inequalities are clearer than Pylint's chained form.
  "chained-comparison",
]
